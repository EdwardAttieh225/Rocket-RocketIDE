name: Attach verified Rocket SDKs

on:
  push:
    branches: [codex/wp07-downloads]
    paths: [.github/workflows/attach-rocket-sdk.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact successful native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/RyanEid06/Rocket/actions/runs/36304020122 > run.json
          python3 - <<'PY'
          import json
          run = json.load(open('run.json'))
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == '1f6ba76f16f3246095d5d573c28d825d8b9367e3'
          PY
          for target in windows-x64 linux-x64 linux-arm64 macos-arm64; do
            gh run download 36304020122 --repo RyanEid06/Rocket \
              --name "rocket-phase19-$target-36304020122" --dir "artifacts/$target"
          done
      - name: Verify package hashes and source identity
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, tarfile, zipfile
          out = pathlib.Path('release-assets'); out.mkdir()
          results = []
          for target in ['windows-x64', 'linux-x64', 'linux-arm64', 'macos-arm64']:
              root = pathlib.Path('artifacts') / target
              report_path = next(root.rglob(f'package-report-{target}.json'))
              report = json.loads(report_path.read_text())
              suffix = '.zip' if target == 'windows-x64' else '.tar.xz'
              archive = next(root.rglob(f'rocket-3.0.0-{target}{suffix}'))
              digest = hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()
              assert digest == report['archive_sha256'], (target, 'hash mismatch')
              if suffix == '.zip':
                  with zipfile.ZipFile(archive) as z:
                      name = next(n for n in z.namelist() if n.endswith('/RELEASE-PROVENANCE.json'))
                      provenance = json.loads(z.read(name))
              else:
                  with tarfile.open(archive) as t:
                      member = next(m for m in t if m.name.endswith('/RELEASE-PROVENANCE.json'))
                      provenance = json.load(t.extractfile(member))
              assert provenance['source_commit'] == '1f6ba76f16f3246095d5d573c28d825d8b9367e3'
              assert provenance['version'] == '3.0.0'
              assert provenance['target'] == target
              shutil.copy2(archive, out / archive.name)
              results.append(dict(filename=archive.name, size=archive.stat().st_size,
                                  sha256=digest, provenance=provenance, report=report))
          (out / 'ROCKET-SDK-PROVENANCE.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps([{k:r[k] for k in ['filename','size','sha256']} for r in results], indent=2))
          PY
      - name: Attach packages to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/RyanEid06/Rocket-RocketIDE/releases/395868559 --jq .draft)" = true
          gh release upload v3.0.0 --repo RyanEid06/Rocket-RocketIDE release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: rocket-sdk-provenance
          path: release-assets/ROCKET-SDK-PROVENANCE.json
