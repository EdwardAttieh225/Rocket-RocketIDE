name: Attach exact verified RocketIDE
on:
  push:
    branches: [codex/wp07-downloads]
    paths: [.github/workflows/attach-verified-ide.yml]
permissions:
  actions: read
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve and attach exact locally verified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/RyanEid06/RocketIDE/actions/runs/36341325372 --jq .conclusion)" = success
          gh run download 36341325372 --repo RyanEid06/RocketIDE --name exact-RocketIDE-1.0.0 --dir ide
          echo 'a5e1966a322ec19e391a775ef1909fec32a51b36b3869215a0117fc24fcb174c  ide/RocketIDE-win-x64-1.0.0.zip' | sha256sum --check
          test "$(gh api repos/RyanEid06/Rocket-RocketIDE/releases/395868559 --jq .draft)" = true
          gh release upload v3.0.0 --repo RyanEid06/Rocket-RocketIDE ide/RocketIDE-win-x64-1.0.0.zip
